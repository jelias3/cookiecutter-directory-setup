name: {{ cookiecutter.repo_name }}
# The DRIVER environment: snakemake itself plus the SLURM executor plugin, and the
# interactive analysis stack. Per-rule tool envs are sibling files in this directory
# (one tool per file, `name:` matching the filename) and are created BY snakemake.
# Tip: on memory-limited login nodes `conda env create` may get OOM-killed during the
# solve; micromamba uses far less memory for the same solve:
#     micromamba env create -f envs/{{ cookiecutter.repo_name }}.yaml --yes
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- workflow engine: keep these together, the plugin is version-coupled ---
  - snakemake>={{ cookiecutter.min_snakemake_version }},<9
  - snakemake-executor-plugin-slurm
  - snakemake-storage-plugin-fs

  # Jupyter / notebook
  - jupyterlab
  - jupyter
  - ipykernel
  - ipython
  - ipywidgets
  - nbconvert
  - nbformat
  - nbclient
  - papermill

  # Core scientific
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - plotnine
  - altair
  - bokeh
  - plotly

  # Data / IO
  - polars
  - pyarrow
  - openpyxl
  - xarray
  - dask

  # Stats / ML
  - scikit-learn
  - statsmodels
  - arviz
  - pymc>=5
  - pip
  - pytensor
  - tensorflow

  # Bioinformatics
  - biopython
  - bedtools
  - pybedtools
  - pysam
  - pygenometracks
  - bedparse
  - pyfaidx
  - gffutils
  - pybigwig
  - bioconda::igv-reports
  - bioconda::spliceai
  - bioconda::htseq
  - bioconda::blast=2.16.0
  - bioconda::hgvs
  # logomaker is a CONDA-FORGE package, not bioconda. The inherited 'bioconda::'
  # prefix forced the single stale bioconda build and made the whole env
  # unsolvable ('not installable because it conflicts with any installable
  # versions'). Unprefixed, conda-forge's current builds are eligible.
  - logomaker
  - bioconda::gseapy  # GO/pathway enrichment (ORA + GSEA)

  # Utilities
  - jinja2
  - pytest
  - tqdm
  - future
  - pycryptodome
  # ca-certificates / certifi / openssl / pyopenssl>=24 were removed: all four are
  # transitive dependencies, and pinning them is a classic cause of an unsatisfiable
  # solve. Let the solver choose them.
  - natsort
  - anndata

  - pip:
    # Trimmed deliberately -- see the PR that introduced this:
    #   - my-utils==0.1.0     REMOVED: that version was never published to PyPI (only
    #                         0.0.1 exists), and the name is generic enough that whatever
    #                         owns it is almost certainly not what was intended.
    #   - pikachu-chem==1.1.5 REMOVED: cheminformatics; add it back per-project
    #                         if a project actually needs it.
    - alphagenome==0.5.1
