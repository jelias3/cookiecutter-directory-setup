$schema: "http://json-schema.org/draft-06/schema#"
description: >
  Row schema for code/config/samples.tsv, validated per-row by snakemake's validate() in
  code/rules/common.smk. Every column added to samples.tsv must be added here too:
  additionalProperties is false on purpose, so a typo'd column name is an error at parse
  time rather than a KeyError three rules later.
type: object
properties:
  Sample:
    type: string
    description: >
      Unique sample ID. This string becomes a Snakemake wildcard and appears in every
      output path for this sample, so renaming it later is a migration, not an edit.
      Grammar (declared in docs/conventions.md §Samples):
      <YY>_<MM>_<DD>_<subject>[_rep<N>], zero-padded date fields, lowercase snake_case
      subject. e.g. 26_08_27_hela_rep1
    # TODO: tighten or relax to match the grammar you actually adopt. Loosening this is
    # fine; loosening it SILENTLY is not -- change docs/conventions.md §Samples too.
    pattern: "^[0-9]{2}_[0-9]{2}_[0-9]{2}_[a-z0-9]+(_rep[0-9]+)?$"
  R1:
    type: string
    description: Path to the read-1 FASTQ, relative to the repo root.
  R2:
    type: string
    description: Path to the read-2 FASTQ, relative to the repo root. Empty for single-end.
    default: ""
  # TODO: add one property per real column, each with a `description`. A column with no
  # description here is a column whose meaning lives only in someone's memory. Use `enum`
  # for closed vocabularies (library type, condition): it catches the typo that would
  # otherwise silently create a new group of one, and survive all the way to a figure.
required:
  - Sample
  - R1
additionalProperties: false
